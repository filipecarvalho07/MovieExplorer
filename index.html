<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c0d11">
    <meta
      name="description"
      content="Seu espaço pessoal para descobrir, acompanhar e avaliar filmes."
    >
    <title>Movie Explorer — seu cinema, organizado</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="styles.css">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module" src="app.js"></script>
  </head>

  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <a
          class="brand"
          href="#dashboard"
          aria-label="Movie Explorer, início"
        >
          <span class="brand-mark">
            <i data-lucide="clapperboard"></i>
          </span>
          <span>movie<span class="brand-light">explorer</span></span>
        </a>

        <div class="side-label">MENU</div>
        <nav class="primary-nav" aria-label="Navegação principal">
          <a href="#inicio" data-route="inicio" class="nav-link active">
            <i data-lucide="layout-dashboard"></i>
            <span>Início</span>
          </a>
          <a href="#explorar" data-route="explorar" class="nav-link">
            <i data-lucide="compass"></i>
            <span>Explorar</span>
            <span class="nav-dot"></span>
          </a>
          <a href="#biblioteca" data-route="biblioteca" class="nav-link">
            <i data-lucide="library"></i>
            <span>Minha biblioteca</span>
          </a>
          <a href="#favoritos" data-route="favoritos" class="nav-link">
            <i data-lucide="heart"></i>
            <span>Favoritos</span>
          </a>
          <a href="#avaliacoes" data-route="avaliacoes" class="nav-link">
            <i data-lucide="star"></i>
            <span>Avaliações</span>
          </a>
          <a href="#estatisticas" data-route="estatisticas" class="nav-link">
            <i data-lucide="chart-no-axes-combined"></i>
            <span>Estatísticas</span>
          </a>
        </nav>

        <div class="side-label side-label-lower">PESSOAL</div>
        <nav class="primary-nav" aria-label="Preferências">
          <a href="#configuracoes" data-route="configuracoes" class="nav-link">
            <i data-lucide="settings-2"></i>
            <span>Configurações</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <div class="sync-card">
            <span class="sync-icon">
              <i data-lucide="cloud"></i>
            </span>
            <div>
              <strong>Sua coleção</strong>
              <small>Salva neste dispositivo</small>
            </div>
            <span class="status-dot"></span>
          </div>

          <div class="profile">
            <div class="avatar">ME</div>
            <div class="profile-text">
              <strong>Filipe</strong>
              <small>Plano pessoal</small>
            </div>
            <button
              class="icon-button profile-more"
              aria-label="Opções do perfil"
            >
              <i data-lucide="ellipsis"></i>
            </button>
          </div>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button
            class="icon-button mobile-menu"
            id="menuToggle"
            aria-label="Abrir menu"
          >
            <i data-lucide="menu"></i>
          </button>

          <div class="breadcrumbs">
            <span>Workspace</span>
            <i data-lucide="chevron-right"></i>
            <strong id="breadcrumbCurrent">Dashboard</strong>
          </div>

          <div class="top-actions">
            <label class="global-search">
              <i data-lucide="search"></i>
              <input
                id="globalSearch"
                type="search"
                placeholder="Buscar filmes..."
                aria-label="Buscar filmes"
              >
              <kbd>⌘ K</kbd>
            </label>

            <button
              class="icon-button notification-button"
              aria-label="Notificações"
            >
              <i data-lucide="bell"></i>
              <span></span>
            </button>
            <div class="top-avatar">ME</div>
          </div>
        </header>

        <div id="pageContent" class="page-content"></div>

        <footer class="footer">
          <span>
            Movie Explorer
            <span class="footer-dot">·</span>
            Seu cinema, organizado.
          </span>
          <span class="demo-note">
            <span class="demo-dot"></span>
            Catálogo demonstrativo
          </span>
        </footer>
      </main>
    </div>

    <div class="toast-region" id="toastRegion" aria-live="polite"></div>

    <dialog class="movie-dialog" id="movieDialog">
      <button
        class="dialog-close icon-button"
        id="dialogClose"
        aria-label="Fechar"
      >
        <i data-lucide="x"></i>
      </button>
      <div id="dialogContent"></div>
    </dialog>
  </body>
</html>
